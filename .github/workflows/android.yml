
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Free Disk Space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          echo "Disk space after cleanup:"
          df -h /

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Build Environment
        run: |
          java -version
          echo "Android SDK: $ANDROID_HOME"
          df -h /

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build --if-present

      - name: Configure Kotlin JVM Target
        shell: bash
        run: |
          cat > kotlin-jvm-init.gradle <<'EOF'
          gradle.beforeProject { project ->
            project.plugins.withId('org.jetbrains.kotlin.android') {
              project.tasks.configureEach { task ->
                if (task.name.startsWith('compile') &&
                    task.name.endsWith('Kotlin') &&
                    task.hasProperty('kotlinOptions')) {
                  task.kotlinOptions.jvmTarget = '21'
                }
              }
            }
          }
          EOF

      - name: Build Android APK
        shell: bash
        run: |
          if [ ! -f android/gradlew ]; then
            echo "ERROR: Android Gradle project not found!"
            exit 1
          fi

          cd android
          chmod +x gradlew

          ./gradlew \
            --init-script ../kotlin-jvm-init.gradle \
            --no-daemon \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK_PATH="android/app/build/outputs/apk/debug"

          if ! ls "$APK_PATH"/*.apk >/dev/null 2>&1; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          ls -lh "$APK_PATH"/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Darzi-Tailor-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
